name: GARCH extension — Kalshi FOMC factors

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 5"  # Friday 10:30 UTC / 18:30 Beijing
  push:
    branches:
      - main
    paths:
      - ".github/workflows/garch-extension-kalshi.yml"

permissions:
  contents: write

jobs:
  build-factors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out extension branch
        uses: actions/checkout@v4
        with:
          ref: garch-extension
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy

      - name: Fetch public upstream derived data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/kalshi
          curl --fail --location --retry 4 --retry-all-errors \
            "https://kalshi-and-the-rise-of-macro-markets.s3.amazonaws.com/daily_moments_data/daily_moments_fed_levels.csv" \
            -o .cache/kalshi/daily_moments_fed_levels.csv
          curl --fail --location --retry 4 --retry-all-errors \
            "https://kalshi-and-the-rise-of-macro-markets.s3.amazonaws.com/daily_distribution_data/daily_distributions_fed_levels.csv" \
            -o .cache/kalshi/daily_distributions_fed_levels.csv

      - name: Build fixed-window factors
        run: |
          python garch_extension/build_kalshi_factors.py \
            --moments .cache/kalshi/daily_moments_fed_levels.csv \
            --distributions .cache/kalshi/daily_distributions_fed_levels.csv \
            --calendar garch_extension/data/fomc_contract_calendar.csv \
            --output garch_extension/data/kalshi_fomc_factors.csv \
            --manifest garch_extension/data/source_manifest.json

      - name: Archive raw public inputs for reproducibility
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-upstream-daily-${{ github.run_id }}
          path: .cache/kalshi/
          retention-days: 30
          if-no-files-found: error

      - name: Commit changed derived factors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garch_extension/data/kalshi_fomc_factors.csv \
                  garch_extension/data/source_manifest.json
          if git diff --cached --quiet; then
            echo "No derived-data changes."
          else
            git commit -m "Update Kalshi FOMC factors"
            git push origin HEAD:garch-extension
          fi
